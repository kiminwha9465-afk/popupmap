<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 - 팝업맵</title>
    <link rel="stylesheet" href="/css/style.css?v=13"/>
    <style>
        .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 36px 24px; }
        .admin-title { font-size: 22px; font-weight: 800; margin-bottom: 28px; }
        .admin-nav { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        .admin-nav a { padding: 8px 18px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 600; color: var(--text); transition: all .15s; }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; border-color: var(--primary); }
        .admin-toolbar { display: flex; align-items: center; margin-bottom: 16px; }
        .admin-count { font-size: 14px; color: var(--text-sub); }
        .admin-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
        .admin-table th { background: var(--bg); padding: 11px 14px; text-align: left; font-size: 13px; font-weight: 700; color: var(--text-sub); border-bottom: 1px solid var(--border); }
        .admin-table td { padding: 11px 14px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover td { background: var(--bg); }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .role-admin { background: #fff0e0; color: #c47a00; }
        .role-user { background: var(--bg); color: var(--text-sub); }
        .btn-del { padding: 5px 12px; background: #fff0f0; color: var(--primary); border: 1px solid #ffd0d0; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .btn-del:hover { background: var(--primary); color: white; }
        .role-select { padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; background: var(--bg); cursor: pointer; }
        .btn-role { padding: 5px 10px; background: #e8f0ff; color: #2255cc; border: 1px solid #bbd0ff; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .btn-role:hover { background: #2255cc; color: white; }
        .flash-msg { padding: 12px 18px; border-radius: var(--radius-sm); margin-bottom: 18px; font-size: 14px; font-weight: 600; }
        .flash-ok { background: #e8f8f0; color: #1a8a4a; border: 1px solid #b2dfc5; }
        .action-cell { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius); }
        @media(max-width: 700px) { .admin-table th:nth-child(3), .admin-table td:nth-child(3) { display: none; } }
        @media(max-width: 600px) {
            .admin-wrap { padding: 16px 12px; }
            .admin-title { font-size: 18px; margin-bottom: 16px; }
            .admin-nav { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; gap: 6px; }
            .admin-nav a { white-space: nowrap; flex-shrink: 0; padding: 7px 13px; font-size: 13px; }
            .admin-table th, .admin-table td { padding: 9px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <div class="header-top">
            <a href="/" class="header-brand">
                <img src="/favicon.svg" class="brand-icon" alt="팝업맵"/>
                <span class="brand-text">팝업맵</span>
            </a>
            <div class="header-top-right" style="margin-left:auto;">
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="auth-link-btn">로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</header>

<div class="admin-wrap">
    <div class="admin-title">회원 관리</div>

    <nav class="admin-nav">
        <a href="/admin">대시보드</a>
        <a href="/admin/stores">팝업 관리</a>
        <a href="/admin/news">게시판 관리</a>
        <a href="/admin/reviews">후기 관리</a>
        <a href="/admin/users" class="active">회원 관리</a>
    </nav>

    <div th:if="${msg}" class="flash-msg flash-ok" th:text="${msg}"></div>

    <div class="admin-toolbar">
        <span class="admin-count">총 <strong th:text="${#lists.size(users)}">0</strong>명</span>
    </div>

    <div class="table-scroll">
    <table class="admin-table">
        <thead>
            <tr>
                <th>아이디</th>
                <th>닉네임</th>
                <th>이메일</th>
                <th>권한</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td style="font-weight:600;" th:text="${u.username}">-</td>
                <td th:text="${u.nickname != null ? u.nickname : '-'}">-</td>
                <td style="font-size:13px;color:var(--text-sub);" th:text="${u.email}">-</td>
                <td>
                    <span class="role-badge"
                          th:classappend="${u.role == 'ROLE_ADMIN'} ? ' role-admin' : ' role-user'"
                          th:text="${u.role == 'ROLE_ADMIN'} ? '관리자' : '일반'">-</span>
                </td>
                <td>
                    <div class="action-cell">
                        <!-- 권한 변경 -->
                        <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" style="display:flex;gap:4px;align-items:center;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select name="role" class="role-select">
                                <option value="ROLE_USER"  th:selected="${u.role == 'ROLE_USER'}">일반</option>
                                <option value="ROLE_ADMIN" th:selected="${u.role == 'ROLE_ADMIN'}">관리자</option>
                            </select>
                            <button type="submit" class="btn-role">변경</button>
                        </form>
                        <!-- 삭제 -->
                        <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                              onsubmit="return confirm('정말 삭제하시겠습니까?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-del">삭제</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    </div>
</div>
<script>
(function(){
    var msgs = document.querySelectorAll('.flash-msg');
    msgs.forEach(function(el){
        setTimeout(function(){ el.style.transition='opacity .6s'; el.style.opacity='0'; }, 5000);
        setTimeout(function(){ el.style.display='none'; }, 5600);
    });
})();
</script>
</body>
</html>
