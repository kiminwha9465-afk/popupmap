<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팝업 관리 - 팝업맵</title>
    <link rel="stylesheet" href="/css/style.css?v=14"/>
    <style>
        .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 36px 24px; }
        .admin-title { font-size: 22px; font-weight: 800; margin-bottom: 28px; }
        .admin-nav { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        .admin-nav a { padding: 8px 18px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 600; color: var(--text); transition: all .15s; }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; border-color: var(--primary); }
        .admin-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .admin-count { font-size: 14px; color: var(--text-sub); }
        .btn-crawl { padding: 8px 18px; background: var(--primary); color: white; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; border: none; cursor: pointer; transition: opacity .15s; }
        .btn-crawl:hover { opacity: .85; }
        .admin-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
        .admin-table th { background: var(--bg); padding: 11px 14px; text-align: left; font-size: 13px; font-weight: 700; color: var(--text-sub); border-bottom: 1px solid var(--border); }
        .admin-table td { padding: 11px 14px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover td { background: var(--bg); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-ongoing { background: #e8f8f0; color: #1a8a4a; }
        .badge-upcoming { background: #fff7e0; color: #b07a00; }
        .badge-ended { background: #f0f0f0; color: #888; }
        .btn-edit { display: inline-block; padding: 5px 12px; background: #e8f0ff; color: #2255cc; border: 1px solid #bbd0ff; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; text-decoration: none; transition: all .15s; }
        .btn-edit:hover { background: #2255cc; color: white; }
        .btn-del { padding: 5px 12px; background: #fff0f0; color: var(--primary); border: 1px solid #ffd0d0; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .btn-del:hover { background: var(--primary); color: white; }
        .flash-msg { padding: 12px 18px; border-radius: var(--radius-sm); margin-bottom: 18px; font-size: 14px; font-weight: 600; }
        .flash-ok { background: #e8f8f0; color: #1a8a4a; border: 1px solid #b2dfc5; }
        .flash-err { background: #fff0f0; color: var(--primary); border: 1px solid #ffd0d0; }
        .img-thumb { width: 48px; height: 36px; object-fit: cover; border-radius: 6px; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius); }
        @media(max-width: 700px) { .admin-table th:nth-child(4), .admin-table td:nth-child(4),
                                   .admin-table th:nth-child(5), .admin-table td:nth-child(5),
                                   .admin-table th:nth-child(6), .admin-table td:nth-child(6) { display: none; } }
        @media(max-width: 600px) {
            .admin-wrap { padding: 16px 12px; }
            .admin-title { font-size: 18px; margin-bottom: 16px; }
            .admin-nav { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; gap: 6px; }
            .admin-nav a { white-space: nowrap; flex-shrink: 0; padding: 7px 13px; font-size: 13px; }
            .admin-table th, .admin-table td { padding: 9px 10px; font-size: 13px; }
            .admin-toolbar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <div class="header-top">
            <a href="/" class="header-brand">
                <img src="/favicon.svg" class="brand-icon" alt="팝업맵"/>
                <span class="brand-text">팝업맵</span>
            </a>
            <div class="header-top-right" style="margin-left:auto;">
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="auth-link-btn">로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</header>

<div class="admin-wrap">
    <div class="admin-title">팝업 관리</div>

    <nav class="admin-nav">
        <a href="/admin">대시보드</a>
        <a href="/admin/stores" class="active">팝업 관리</a>
        <a href="/admin/news">게시판 관리</a>
        <a href="/admin/reviews">후기 관리</a>
        <a href="/admin/users">회원 관리</a>
    </nav>

    <div th:if="${msg}" class="flash-msg flash-ok" th:text="${msg}"></div>
    <div th:if="${error}" class="flash-msg flash-err" th:text="${error}"></div>

    <div class="admin-toolbar">
        <span class="admin-count">총 <strong th:text="${#lists.size(stores)}">0</strong>개</span>
        <div style="display:flex;gap:8px;">
            <a href="/admin/stores/new" class="btn-crawl" style="text-decoration:none;">+ 수동 등록</a>
            <form th:action="@{/admin/crawl}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-crawl">팝가 크롤링 실행</button>
            </form>
        </div>
    </div>

    <div class="table-scroll">
    <table class="admin-table">
        <thead>
            <tr>
                <th>썸네일</th>
                <th>이름</th>
                <th>카테고리</th>
                <th>지역</th>
                <th>기간</th>
                <th>상태</th>
                <th>수정</th>
                <th>삭제</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${stores}">
                <td>
                    <img th:if="${s.imageUrl}" th:src="${s.imageUrl}" class="img-thumb" alt=""/>
                    <span th:unless="${s.imageUrl}" style="color:var(--text-sub);font-size:12px;">-</span>
                </td>
                <td>
                    <a th:href="@{/store/{id}(id=${s.id})}"
                       style="color:var(--primary);font-weight:600;" th:text="${s.name}"></a>
                </td>
                <td th:text="${s.category}">-</td>
                <td th:text="${s.region}">-</td>
                <td style="font-size:13px;color:var(--text-sub);">
                    <span th:text="${s.startDate}">-</span> ~
                    <span th:text="${s.endDate}">-</span>
                </td>
                <td>
                    <span th:with="today=${T(java.time.LocalDate).now()}"
                          th:classappend="${s.endDate != null and s.endDate.isBefore(today)} ? 'badge-ended' :
                                          (${s.startDate != null and s.startDate.isAfter(today)} ? 'badge-upcoming' : 'badge-ongoing')"
                          class="badge"
                          th:text="${s.endDate != null and s.endDate.isBefore(today)} ? '종료' :
                                    (${s.startDate != null and s.startDate.isAfter(today)} ? '예정' : '진행중')">
                    </span>
                </td>
                <td>
                    <a th:href="@{/admin/stores/{id}/edit(id=${s.id})}" class="btn-edit">수정</a>
                </td>
                <td>
                    <form th:action="@{/admin/stores/{id}/delete(id=${s.id})}" method="post"
                          onsubmit="return confirm('삭제하시겠습니까?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-del">삭제</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    </div>
</div>
<script>
(function(){
    var msgs = document.querySelectorAll('.flash-msg');
    msgs.forEach(function(el){
        setTimeout(function(){ el.style.transition='opacity .6s'; el.style.opacity='0'; }, 5000);
        setTimeout(function(){ el.style.display='none'; }, 5600);
    });
})();
</script>
</body>
</html>
