<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${store != null} ? '?앹뾽?ㅽ넗???섏젙 - ?앹뾽留? : '?앹뾽?ㅽ넗???깅줉 - ?앹뾽留?">?앹뾽?ㅽ넗???깅줉 - ?앹뾽留?/title>
    <link rel="stylesheet" href="/css/style.css?v=16"/>
    <style>
        .admin-wrap { max-width: 760px; margin: 0 auto; padding: 36px 24px; }
        .admin-title { font-size: 22px; font-weight: 800; margin-bottom: 28px; }
        .admin-nav { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        .admin-nav a { padding: 8px 18px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 600; color: var(--text); transition: all .15s; }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; border-color: var(--primary); }

        .form-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 28px 32px; }
        .form-section { font-size: 13px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: .04em; margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .form-section:first-of-type { margin-top: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .form-row.full { grid-template-columns: 1fr; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text); }
        .form-group label span.req { color: var(--primary); margin-left: 2px; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; background: var(--bg); color: var(--text);
            transition: border-color .15s; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary);
        }
        .form-group textarea { resize: vertical; min-height: 90px; }
        .form-hint { font-size: 12px; color: var(--text-sub); }

        .addr-row { display: flex; gap: 8px; align-items: flex-end; }
        .addr-row input { flex: 1; }
        .btn-geocode { white-space: nowrap; padding: 9px 14px; background: #e8f0ff; color: #2255cc;
            border: 1px solid #bbd0ff; border-radius: var(--radius-sm); font-size: 13px;
            font-weight: 600; cursor: pointer; transition: all .15s; }
        .btn-geocode:hover { background: #2255cc; color: white; }
        .geocode-status { font-size: 12px; color: var(--text-sub); min-height: 18px; }

        .form-actions { display: flex; gap: 10px; margin-top: 28px; justify-content: flex-end; }
        .btn-submit { padding: 10px 28px; background: var(--primary); color: white; border: none;
            border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s; }
        .btn-submit:hover { opacity: .85; }
        .btn-cancel { padding: 10px 20px; background: var(--surface); color: var(--text-sub);
            border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-cancel:hover { background: var(--bg); }

        @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 20px 16px; } }
    </style>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <div class="header-top">
            <a href="/" class="header-brand">
                <img src="/favicon.svg" class="brand-icon" alt="?앹뾽留?/>
                <span class="brand-text">?앹뾽留?/span>
            </a>
            <div class="header-top-right" style="margin-left:auto;">
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="auth-link-btn">濡쒓렇?꾩썐</button>
                </form>
            </div>
        </div>
    </div>
</header>

<div class="admin-wrap">
    <div class="admin-title" th:text="${store != null} ? '?앹뾽?ㅽ넗???섏젙' : '?앹뾽?ㅽ넗???섎룞 ?깅줉'">?앹뾽?ㅽ넗???섎룞 ?깅줉</div>

    <nav class="admin-nav">
        <a href="/admin">??쒕낫??/a>
        <a href="/admin/stores" class="active">?앹뾽 愿由?/a>
        <a href="/admin/news">寃뚯떆??愿由?/a>
        <a href="/admin/reviews">?꾧린 愿由?/a>
        <a href="/admin/users">?뚯썝 愿由?/a>
    </nav>

    <div class="form-card">
        <form th:action="${store != null} ? @{/admin/stores/{id}/edit(id=${store.id})} : @{/admin/stores/new}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- 湲곕낯 ?뺣낫 -->
            <div class="form-section">湲곕낯 ?뺣낫</div>
            <div class="form-row">
                <div class="form-group">
                    <label>?대쫫 <span class="req">*</span></label>
                    <input type="text" name="name" required placeholder="?? ?섏씠???앹뾽?ㅽ넗??
                           th:value="${store?.name}"/>
                </div>
                <div class="form-group">
                    <label>釉뚮옖??/label>
                    <input type="text" name="brand" placeholder="?? Nike"
                           th:value="${store?.brand}"/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>移댄뀒怨좊━</label>
                    <select name="category">
                        <option value="" th:selected="${store == null or store.category == null or store.category.isBlank()}">?좏깮 ????/option>
                        <option th:each="cat : ${ {'?⑥뀡','酉고떚','?앹쓬猷?,'?쇱씠?꾩뒪???,'?꾪듃/臾명솕','?뷀꽣?뚯씤癒쇳듃','?뚰겕','?⑥뀡/?섎쪟','酉고떚/肄붿뒪硫뷀떛','?꾩옄/IT','臾명솕/?덉닠','?ㅽ룷痢?,'湲고?'} }"
                                th:value="${cat}" th:text="${cat}"
                                th:selected="${store != null and store.category == cat}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>吏??/label>
                    <select name="region">
                        <option value="" th:selected="${store == null or store.region == null or store.region.isBlank()}">?좏깮 ????/option>
                        <option th:each="reg : ${ {'?쒖슱','寃쎄린','遺??,'?援?,'?몄쿇','愿묒＜','???,'?몄궛','?몄쥌','媛뺤썝','異⑸턿','異⑸궓','?꾨턿','?꾨궓','寃쎈턿','寃쎈궓','?쒖＜'} }"
                                th:value="${reg}" th:text="${reg}"
                                th:selected="${store != null and store.region == reg}"></option>
                    </select>
                </div>
            </div>

            <!-- 湲곌컙 -->
            <div class="form-section">?댁쁺 湲곌컙</div>
            <div class="form-row">
                <div class="form-group">
                    <label>?쒖옉??/label>
                    <input type="date" name="startDate"
                           th:value="${store?.startDate}"/>
                </div>
                <div class="form-group">
                    <label>醫낅즺??/label>
                    <input type="date" name="endDate"
                           th:value="${store?.endDate}"/>
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>?댁쁺?쒓컙</label>
                    <input type="text" name="hours" placeholder="?? ?됱씪 10:00~20:00, 二쇰쭚 11:00~21:00"
                           th:value="${store?.hours}"/>
                </div>
            </div>

            <!-- ?꾩튂 -->
            <div class="form-section">?꾩튂</div>
            <div class="form-row full">
                <div class="form-group">
                    <label>二쇱냼</label>
                    <div class="addr-row">
                        <input type="text" name="address" id="address" placeholder="?? ?쒖슱?밸퀎??媛뺣궓援??뺢뎄?뺣줈 354"
                               th:value="${store?.address}"/>
                        <button type="button" class="btn-geocode" onclick="geocode()">醫뚰몴 ?먮룞 ?낅젰</button>
                    </div>
                    <span class="geocode-status" id="geocodeStatus"></span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>?꾨룄 (latitude)</label>
                    <input type="number" name="latitude" id="latitude" step="any" placeholder="?? 37.5665"
                           th:value="${store != null and store.latitude != 0} ? ${store.latitude} : ''"/>
                    <span class="form-hint">二쇱냼 ?낅젰 ??'醫뚰몴 ?먮룞 ?낅젰' 踰꾪듉 ?ъ슜</span>
                </div>
                <div class="form-group">
                    <label>寃쎈룄 (longitude)</label>
                    <input type="number" name="longitude" id="longitude" step="any" placeholder="?? 126.9780"
                           th:value="${store != null and store.longitude != 0} ? ${store.longitude} : ''"/>
                </div>
            </div>

            <!-- 異붽? ?뺣낫 -->
            <div class="form-section">異붽? ?뺣낫</div>
            <div class="form-row full">
                <div class="form-group">
                    <label>?대?吏 URL</label>
                    <input type="url" name="imageUrl" placeholder="https://..."
                           th:value="${store?.imageUrl}"/>
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>怨듭떇 ?뱀궗?댄듃</label>
                    <input type="url" name="website" placeholder="https://..."
                           th:value="${store?.website}"/>
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>?ㅻ챸</label>
                    <textarea name="description" placeholder="?앹뾽?ㅽ넗?댁뿉 ????ㅻ챸???낅젰?섏꽭??"
                              th:text="${store?.description}"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="history.back()">痍⑥냼</button>
                <button type="submit" class="btn-submit"
                        th:text="${store != null} ? '?섏젙?섍린' : '?깅줉?섍린'">?깅줉?섍린</button>
            </div>
        </form>
    </div>
</div>

<script>
async function geocode() {
    const addr = document.getElementById('address').value.trim();
    const status = document.getElementById('geocodeStatus');
    if (!addr) { status.textContent = '二쇱냼瑜?癒쇱? ?낅젰?섏꽭??'; return; }
    status.textContent = '寃??以?..';
    try {
        const res = await fetch(
            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(addr)}&format=json&limit=1&accept-language=ko`,
            { headers: { 'Accept-Language': 'ko' } }
        );
        const data = await res.json();
        if (data.length === 0) { status.textContent = '二쇱냼瑜?李얠쓣 ???놁뒿?덈떎. 吏곸젒 ?낅젰?댁＜?몄슂.'; return; }
        document.getElementById('latitude').value = parseFloat(data[0].lat).toFixed(6);
        document.getElementById('longitude').value = parseFloat(data[0].lon).toFixed(6);
        status.textContent = `醫뚰몴 ?낅젰 ?꾨즺: ${data[0].display_name.substring(0, 50)}...`;
    } catch (e) {
        status.textContent = '醫뚰몴 議고쉶 ?ㅽ뙣. 吏곸젒 ?낅젰?댁＜?몄슂.';
    }
}
</script>
</body>
</html>
