<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팝업스토어 등록 - 팝업맵</title>
    <link rel="stylesheet" href="/css/style.css?v=8"/>
    <style>
        .admin-wrap { max-width: 760px; margin: 0 auto; padding: 36px 24px; }
        .admin-title { font-size: 22px; font-weight: 800; margin-bottom: 28px; }
        .admin-nav { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        .admin-nav a { padding: 8px 18px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 600; color: var(--text); transition: all .15s; }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; border-color: var(--primary); }

        .form-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 28px 32px; }
        .form-section { font-size: 13px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: .04em; margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .form-section:first-of-type { margin-top: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .form-row.full { grid-template-columns: 1fr; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text); }
        .form-group label span.req { color: var(--primary); margin-left: 2px; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; background: var(--bg); color: var(--text);
            transition: border-color .15s; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary);
        }
        .form-group textarea { resize: vertical; min-height: 90px; }
        .form-hint { font-size: 12px; color: var(--text-sub); }

        .addr-row { display: flex; gap: 8px; align-items: flex-end; }
        .addr-row input { flex: 1; }
        .btn-geocode { white-space: nowrap; padding: 9px 14px; background: #e8f0ff; color: #2255cc;
            border: 1px solid #bbd0ff; border-radius: var(--radius-sm); font-size: 13px;
            font-weight: 600; cursor: pointer; transition: all .15s; }
        .btn-geocode:hover { background: #2255cc; color: white; }
        .geocode-status { font-size: 12px; color: var(--text-sub); min-height: 18px; }

        .form-actions { display: flex; gap: 10px; margin-top: 28px; justify-content: flex-end; }
        .btn-submit { padding: 10px 28px; background: var(--primary); color: white; border: none;
            border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s; }
        .btn-submit:hover { opacity: .85; }
        .btn-cancel { padding: 10px 20px; background: var(--surface); color: var(--text-sub);
            border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-cancel:hover { background: var(--bg); }

        @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-card { padding: 20px 16px; } }
    </style>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <div class="header-top">
            <a href="/" class="header-brand">
                <img src="/favicon.svg" class="brand-icon" alt="팝업맵"/>
                <span class="brand-text">팝업맵</span>
            </a>
            <div class="header-top-right" style="margin-left:auto;">
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="auth-link-btn">로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</header>

<div class="admin-wrap">
    <div class="admin-title">팝업스토어 수동 등록</div>

    <nav class="admin-nav">
        <a href="/admin">대시보드</a>
        <a href="/admin/stores" class="active">팝업 관리</a>
        <a href="/admin/news">게시판 관리</a>
        <a href="/admin/reviews">후기 관리</a>
        <a href="/admin/users">회원 관리</a>
    </nav>

    <div class="form-card">
        <form th:action="@{/admin/stores/new}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- 기본 정보 -->
            <div class="form-section">기본 정보</div>
            <div class="form-row">
                <div class="form-group">
                    <label>이름 <span class="req">*</span></label>
                    <input type="text" name="name" required placeholder="예) 나이키 팝업스토어"/>
                </div>
                <div class="form-group">
                    <label>브랜드</label>
                    <input type="text" name="brand" placeholder="예) Nike"/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>카테고리</label>
                    <select name="category">
                        <option value="">선택 안 함</option>
                        <option>패션/의류</option>
                        <option>뷰티/코스메틱</option>
                        <option>식음료</option>
                        <option>라이프스타일</option>
                        <option>전자/IT</option>
                        <option>문화/예술</option>
                        <option>스포츠</option>
                        <option>기타</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>지역</label>
                    <select name="region">
                        <option value="">선택 안 함</option>
                        <option>서울</option>
                        <option>경기</option>
                        <option>부산</option>
                        <option>대구</option>
                        <option>인천</option>
                        <option>광주</option>
                        <option>대전</option>
                        <option>울산</option>
                        <option>세종</option>
                        <option>강원</option>
                        <option>충북</option>
                        <option>충남</option>
                        <option>전북</option>
                        <option>전남</option>
                        <option>경북</option>
                        <option>경남</option>
                        <option>제주</option>
                    </select>
                </div>
            </div>

            <!-- 기간 -->
            <div class="form-section">운영 기간</div>
            <div class="form-row">
                <div class="form-group">
                    <label>시작일</label>
                    <input type="date" name="startDate"/>
                </div>
                <div class="form-group">
                    <label>종료일</label>
                    <input type="date" name="endDate"/>
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>운영시간</label>
                    <input type="text" name="hours" placeholder="예) 평일 10:00~20:00, 주말 11:00~21:00"/>
                </div>
            </div>

            <!-- 위치 -->
            <div class="form-section">위치</div>
            <div class="form-row full">
                <div class="form-group">
                    <label>주소</label>
                    <div class="addr-row">
                        <input type="text" name="address" id="address" placeholder="예) 서울특별시 강남구 압구정로 354"/>
                        <button type="button" class="btn-geocode" onclick="geocode()">좌표 자동 입력</button>
                    </div>
                    <span class="geocode-status" id="geocodeStatus"></span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>위도 (latitude)</label>
                    <input type="number" name="latitude" id="latitude" step="any" placeholder="예) 37.5665"/>
                    <span class="form-hint">주소 입력 후 '좌표 자동 입력' 버튼 사용</span>
                </div>
                <div class="form-group">
                    <label>경도 (longitude)</label>
                    <input type="number" name="longitude" id="longitude" step="any" placeholder="예) 126.9780"/>
                </div>
            </div>

            <!-- 추가 정보 -->
            <div class="form-section">추가 정보</div>
            <div class="form-row full">
                <div class="form-group">
                    <label>이미지 URL</label>
                    <input type="url" name="imageUrl" placeholder="https://..."/>
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>공식 웹사이트</label>
                    <input type="url" name="website" placeholder="https://..."/>
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>설명</label>
                    <textarea name="description" placeholder="팝업스토어에 대한 설명을 입력하세요."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                <button type="submit" class="btn-submit">등록하기</button>
            </div>
        </form>
    </div>
</div>

<script>
async function geocode() {
    const addr = document.getElementById('address').value.trim();
    const status = document.getElementById('geocodeStatus');
    if (!addr) { status.textContent = '주소를 먼저 입력하세요.'; return; }
    status.textContent = '검색 중...';
    try {
        const res = await fetch(
            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(addr)}&format=json&limit=1&accept-language=ko`,
            { headers: { 'Accept-Language': 'ko' } }
        );
        const data = await res.json();
        if (data.length === 0) { status.textContent = '주소를 찾을 수 없습니다. 직접 입력해주세요.'; return; }
        document.getElementById('latitude').value = parseFloat(data[0].lat).toFixed(6);
        document.getElementById('longitude').value = parseFloat(data[0].lon).toFixed(6);
        status.textContent = `좌표 입력 완료: ${data[0].display_name.substring(0, 50)}...`;
    } catch (e) {
        status.textContent = '좌표 조회 실패. 직접 입력해주세요.';
    }
}
</script>
</body>
</html>
