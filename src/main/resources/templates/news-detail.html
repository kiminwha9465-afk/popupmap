<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${news.title} + ' - 팝업맵'">팝업 소식</title>
    <link rel="stylesheet" href="/css/style.css?v=14"/>
</head>
<body>

<header class="header">
<div class="header-inner">
    <!-- 1행: 로고 / 인증 -->
    <div class="header-top">
        <a href="/" class="header-brand">
            <img src="/favicon.svg" class="brand-icon" alt="팝업맵"/>
            <span class="brand-text">팝업맵</span>
        </a>
        <div class="header-top-right">
            <div class="header-right">
                <div class="header-auth">
                    <span sec:authorize="isAuthenticated()" class="header-user">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                        </svg>
                        <span sec:authentication="name"></span>
                    </span>
                    <div sec:authorize="isAuthenticated()" class="bell-wrap">
                        <button class="bell-btn" id="bellBtn" title="알림">
                            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="1.6"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
                            </svg>
                            <span th:if="${bellCount != null and bellCount > 0}" class="bell-badge" th:text="${bellCount}"></span>
                        </button>
                        <div class="bell-dropdown" id="bellDropdown" hidden>
                            <div class="bell-dd-hd">D-3 마감 북마크</div>
                            <div th:if="${bellCount == null or bellCount == 0}" class="bell-dd-empty">임박한 종료 팝업이 없어요</div>
                            <a th:each="item : ${bellItems}" th:href="@{/store/{id}(id=${item.id})}" class="bell-dd-item">
                                <span class="bell-dd-name" th:text="${item.name}"></span>
                                <span class="bell-dd-dday"
                                      th:text="${item.dday == 0} ? 'D-DAY' : ('D-' + ${item.dday})"
                                      th:classappend="${item.dday == 0} ? ' dday-today'"></span>
                            </a>
                            <a href="/mypage" class="bell-dd-footer">북마크 관리 →</a>
                        </div>
                    </div>
                    <a sec:authorize="hasRole('ADMIN')" href="/admin" class="auth-link-btn admin-link-btn">관리자페이지</a>
                    <a sec:authorize="isAuthenticated()" href="/mypage" class="auth-link-btn">마이페이지</a>
                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline;">
                        <button type="submit" class="auth-link-btn">로그아웃</button>
                    </form>
                    <a sec:authorize="isAnonymous()" href="/login" class="auth-link-btn">로그인</a>
                    <a sec:authorize="isAnonymous()" href="/signup" class="auth-link-btn signup">회원가입</a>
                </div>
            </div>
        </div>
    </div>
    <!-- 2행: 네비게이션 (항상 표시, 모바일에서 가로 스크롤) -->
    <div class="header-nav-row">
        <nav class="header-nav">
            <span class="nav-group-label">팝업</span>
            <a href="/stores" class="nav-link">전체보기</a>
            <a href="/stores?category=패션" class="nav-link nav-cat-item">패션</a>
            <a href="/stores?category=뷰티" class="nav-link nav-cat-item">뷰티</a>
            <a href="/stores?category=식음료" class="nav-link nav-cat-item">식음료</a>
            <a href="/stores?category=라이프스타일" class="nav-link nav-cat-item">라이프스타일</a>
            <a href="/stores?category=아트/문화" class="nav-link nav-cat-item">아트/문화</a>
            <a href="/stores?category=엔터테인먼트" class="nav-link nav-cat-item">엔터테인먼트</a>
            <a href="/stores?category=테크" class="nav-link nav-cat-item">테크</a>
            <details class="nav-dropdown">
                <summary>
                    카테고리
                    <svg class="drop-arrow" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
                </summary>
                <div class="nav-dropdown-menu">
                    <a href="/stores?category=패션" class="nav-dropdown-item">패션</a>
                    <a href="/stores?category=뷰티" class="nav-dropdown-item">뷰티</a>
                    <a href="/stores?category=식음료" class="nav-dropdown-item">식음료</a>
                    <a href="/stores?category=라이프스타일" class="nav-dropdown-item">라이프스타일</a>
                    <a href="/stores?category=아트/문화" class="nav-dropdown-item">아트/문화</a>
                    <a href="/stores?category=엔터테인먼트" class="nav-dropdown-item">엔터테인먼트</a>
                    <a href="/stores?category=테크" class="nav-dropdown-item">테크</a>
                </div>
            </details>
            <span class="nav-sep"></span>
            <span class="nav-group-label">커뮤니티</span>
            <a href="/news" class="nav-link nav-news-item">전체</a>
            <a href="/news?tag=공지" class="nav-link nav-news-item">공지</a>
            <a href="/news?tag=소식" class="nav-link nav-news-item">소식</a>
            <a href="/news?tag=트렌드" class="nav-link nav-news-item">트렌드</a>
            <a href="/news?tag=후기" class="nav-link nav-news-item">후기</a>
            <details class="nav-dropdown">
                <summary>
                    커뮤니티
                    <svg class="drop-arrow" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
                </summary>
                <div class="nav-dropdown-menu">
                    <a href="/news" class="nav-dropdown-item">전체</a>
                    <a href="/news?tag=공지" class="nav-dropdown-item">공지</a>
                    <a href="/news?tag=소식" class="nav-dropdown-item">소식</a>
                    <a href="/news?tag=트렌드" class="nav-dropdown-item">트렌드</a>
                    <div class="nav-dropdown-divider"></div>
                    <span class="nav-dropdown-label">후기</span>
                    <a href="/news?tag=후기" class="nav-dropdown-item">후기</a>
                </div>
            </details>
        </nav>
    </div>
</div>
</header>

<div class="news-detail-page">
    <div class="news-detail-inner">

        <a th:href="${backUrl}" class="news-detail-back">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            목록으로
        </a>

        <div class="news-detail-header">
            <span class="news-tag nd-tag" th:text="${news.tag}"></span>
            <h1 class="news-detail-title" th:text="${news.title}"></h1>
            <a th:if="${linkedStore != null}" th:href="@{/store/{id}(id=${linkedStore.id})}" class="news-linked-store">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span th:text="${linkedStore.name}"></span>
            </a>
            <div class="news-detail-meta">
                <span class="news-detail-author">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                    <span th:text="${news.author} ?: '알 수 없음'"></span>
                </span>
                <span class="meta-dot">·</span>
                <span th:text="${#temporals.format(news.publishedAt, 'yyyy.MM.dd')}"></span>
                <span class="meta-dot">·</span>
                <span>조회 <span th:text="${news.viewCount}"></span></span>
            </div>
        </div>

        <div class="news-detail-divider"></div>

        <img th:if="${news.thumbnailUrl != null and !#strings.isEmpty(news.thumbnailUrl)}"
             th:src="${news.thumbnailUrl}" th:alt="${news.title}" class="news-detail-thumb"
             onerror="this.onerror=null;this.src='/img/no-image.svg';"/>

        <div class="news-detail-content" th:text="${news.content}"></div>

        <div class="news-detail-footer">
            <div class="nd-btn-group">
            <button type="button" class="nd-helpful-btn" id="ndLikeBtn"
                    th:classappend="${liked} ? ' liked' : ''"
                    onclick="submitLike()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
                    <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                </svg>
                도움이 되었어요
                <span id="ndLikeCount" th:text="${likeCount > 0} ? '(' + ${likeCount} + ')' : ''"></span>
            </button>
            <div th:if="${isAuthor}">
                <form th:action="@{/news/{id}/delete(id=${news.id})}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?')">
                    <button type="submit" class="news-delete-btn">삭제</button>
                </form>
            </div>
            </div>
        </div>

    </div>
</div>

<footer class="footer">
    <div class="footer-inner">
        <span class="footer-logo"><img src="/favicon.svg" class="brand-icon" alt="팝업맵"/> 팝업맵</span>
        <span class="footer-copy">전국 팝업스토어 일정 및 위치 정보 서비스</span>
    </div>
</footer>

<script src="/js/nav.js"></script>
<script th:inline="javascript">
var newsId    = /*[[${news.id}]]*/ 0;
var loggedIn  = /*[[${isLoggedIn}]]*/ false;

function submitLike() {
    if (!loggedIn) { window.location.href = '/login'; return; }
    var csrf   = document.querySelector('meta[name="_csrf"]').content;
    var header = document.querySelector('meta[name="_csrf_header"]').content;
    fetch('/api/news/' + newsId + '/like', { method: 'POST', headers: { [header]: csrf } })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var btn = document.getElementById('ndLikeBtn');
            var cnt = document.getElementById('ndLikeCount');
            btn.classList.toggle('liked', data.liked);
            cnt.textContent = data.likeCount > 0 ? '(' + data.likeCount + ')' : '';
        });
}
</script>
</body>
</html>
