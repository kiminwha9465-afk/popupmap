<main class="mp-wrap">

    <!-- ???ㅻ퉬寃뚯씠??-->

    <!-- ?? ?? 遺곷쭏??愿由????????????????????????????? -->
    <div class="mp-panel" id="panel-bookmarks">
        <div th:if="${items.isEmpty()}" class="mp-empty">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                 fill="none" stroke="#ccc" stroke-width="1.5"><path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
            <p>遺곷쭏?ы븳 ?앹뾽???놁뒿?덈떎.</p>

        </div>
        <div th:unless="${items.isEmpty()}" class="mp-bm-list">
            <div th:each="item : ${items}" class="mp-bm-row" th:data-id="${item.store.id}">
                <img th:src="${item.store.imageUrl}" th:alt="${item.store.name}" class="mp-bm-thumb"
                     onerror="this.onerror=null;this.style.background='#eee';this.removeAttribute('src')"/>

                    <span class="mp-bm-badge"

                    <div class="mp-bm-meta">
                        <span th:text="${item.store.region}"></span>
                        <span class="mp-bm-dot">쨌</span>
                        <span>
                            <th:block th:text="${item.store.startDate != null ? #temporals.format(item.store.startDate,'yy.MM.dd') : ''}"></th:block>

                            <th:block th:text="${item.store.endDate != null ? #temporals.format(item.store.endDate,'yy.MM.dd') : ''}"></th:block>

            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                 fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <p>遺곷쭏?ы븳 ?앹뾽???놁뒿?덈떎.</p>
        </div>
        <div th:unless="${items.isEmpty()}" class="mp-dday-list">
            <a th:each="item : ${ddayItems}"
               th:href="@{/store/{id}(id=${item.store.id})}"
               class="mp-dday-row"
               th:classappend="${item.storeStatus=='ended'} ? ' dday-ended' : ''">
                <img th:src="${item.store.imageUrl}" th:alt="${item.store.name}" class="mp-dday-thumb"
                     onerror="this.onerror=null;this.style.background='#eee';this.removeAttribute('src')"/>
                <div class="mp-dday-info">
                    <div class="mp-dday-name" th:text="${item.store.name}"></div>
                    <div class="mp-dday-meta">
                        <span th:text="${item.store.region}"></span>
                        <span class="mp-dday-dot">쨌</span>
                        <span>
                            <th:block th:text="${item.store.startDate != null ? #temporals.format(item.store.startDate,'yy.MM.dd') : ''}"></th:block>
                            ~
                            <th:block th:text="${item.store.endDate != null ? #temporals.format(item.store.endDate,'yy.MM.dd') : ''}"></th:block>
                        </span>
                    </div>
                </div>
                <span class="mp-dday-badge"
                      th:classappend="${item.storeStatus=='ended'} ? ' dday-b-ended' : (${item.storeStatus=='upcoming'} ? ' dday-b-upcoming' : (${item.dday}<=3 ? ' dday-b-urgent' : (${item.dday}<=7 ? ' dday-b-soon' : ' dday-b-ok')))"
                      th:text="${item.ddayLabel}">D-?</span>
                <svg class="mp-dday-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16"

                </svg>
            </a>

    <div class="mp-panel" id="panel-status" hidden>
        <div th:if="${items.isEmpty()}" class="mp-empty">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                 fill="none" stroke="#ccc" stroke-width="1.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <p>遺곷쭏?ы븳 ?앹뾽???놁뒿?덈떎.</p>
        </div>
        <div th:unless="${items.isEmpty()}" class="mp-status-cols">

                    <span class="mp-status-cnt" th:text="${plannedCount} + '媛?">0媛?/span>
                </div>
                <div class="mp-status-list">
                    <div th:each="item : ${items}" th:if="${item.visitStatus=='PLANNED'}"
                         class="mp-status-item" th:data-id="${item.store.id}">
                        <img th:src="${item.store.imageUrl}" class="mp-status-img"
                             onerror="this.onerror=null;this.style.background='#eee';this.removeAttribute('src')"/>
                        <div class="mp-status-info">
                            <div class="mp-status-name" th:text="${item.store.name}"></div>
                            <div class="mp-status-meta">
                                <span th:text="${item.store.region}"></span>
                                <span class="mp-status-dday" th:text="${item.ddayLabel}"></span>
                            </div>
                        </div>
                        <button class="mp-status-toggle planned-toggle"

                            諛⑸Ц?꾨즺
                        </button>
                    </div>
                    <div th:if="${plannedCount==0}" class="mp-status-empty">諛⑸Ц ?덉젙 ?앹뾽???놁뼱??</div>

                                <span th:text="${item.store.region}"></span>
                                <span class="mp-status-dday" th:text="${item.ddayLabel}"></span>

            <p>?묒꽦??由щ럭媛 ?놁뒿?덈떎.</p>
            <a href="/news?tag=?꾧린" class="mp-empty-btn">?꾧린 ?묒꽦?섍린</a>

                        </div>
                    </div>
                    <div class="mp-post-info">
                        <span class="mp-post-tag">?꾧린</span>
                        <div class="mp-post-title" th:text="${r.title}"></div>
                        <div class="mp-post-meta">
                            <span th:text="${r.publishedAt != null ? #temporals.format(r.publishedAt,'yyyy.MM.dd') : ''}"></span>
                            <span>議고쉶 <span th:text="${r.viewCount}"></span></span>
                        </div>
                    </div>
                    <svg class="mp-post-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </a>
                <button class="mp-review-del" th:onclick="|deleteReview(${r.id})|">??젣</button>
            </div>
        </div>
    </div>

    <!-- ?? ?? ?꾩? 紐⑸줉 ?????????????????????????????? -->

            <p>?꾩????섏뿀?댁슂瑜??꾨Ⅸ 寃뚯떆臾쇱씠 ?놁뒿?덈떎.</p>
        </div>
        <div th:unless="${likedPosts.isEmpty()}" class="mp-post-list">
            <a th:each="p : ${likedPosts}"
               th:href="@{/news/{id}(id=${p.id})}"
               class="mp-post-item">
                <div class="mp-post-thumb-wrap">
                    <img th:if="${p.thumbnailUrl != null and !#strings.isEmpty(p.thumbnailUrl)}"
                         th:src="${p.thumbnailUrl}" th:alt="${p.title}" class="mp-post-thumb"
                         onerror="this.onerror=null;this.style.background='#eee';this.removeAttribute('src')"/>
                    <div th:unless="${p.thumbnailUrl != null and !#strings.isEmpty(p.thumbnailUrl)}"
                         class="mp-post-thumb-ph">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                             fill="none" stroke="#ccc" stroke-width="1.5"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/></svg>
                    </div>
                </div>
                <div class="mp-post-info">
                    <span class="mp-post-tag" th:text="${p.tag}"></span>
                    <div class="mp-post-title" th:text="${p.title}"></div>
                    <div class="mp-post-meta">
                        <span th:text="${p.author}"></span>
                        <span th:text="${p.publishedAt != null ? #temporals.format(p.publishedAt,'yyyy.MM.dd') : ''}"></span>
                    </div>
                </div>
                <svg class="mp-post-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">

<script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=t6ao0o80r6"></script>
<script th:inline="javascript">
    window.mypageItems = /*[[${itemsJson}]]*/ [];
</script>
<script src="/js/nav.js"></script>
<script>
    /* ?? ???꾪솚 ????????????????????????????????????? */
    function switchTab(name, btn) {
        document.querySelectorAll('.mp-tab').forEach(function(t){ t.classList.remove('active'); });
        btn.classList.add('active');
        document.querySelectorAll('.mp-panel').forEach(function(p){ p.hidden = true; });
        document.getElementById('panel-' + name).hidden = false;
    }
    function switchTabById(name) {
        var btn = document.getElementById('tab-' + name)
                || document.querySelector('.mp-tab[onclick*="\'' + name + '\'"]');
        if (btn) switchTab(name, btn);
    }

    /* ?? CSRF ?ㅻ뜑 ??????????????????????????????????? */
    function csrfHeaders(json) {
        var csrf = document.querySelector('meta[name="_csrf"]')?.content;
        var hdr  = document.querySelector('meta[name="_csrf_header"]')?.content;
        var h = json ? { 'Content-Type': 'application/json' } : {};
        if (csrf && hdr) h[hdr] = csrf;
        return h;
    }

    /* ?? 遺곷쭏???쒓굅 ?????????????????????????????????? */
    function removeBookmark(storeId) {
        if (!confirm('遺곷쭏?щ? ?쒓굅?섏떆寃좎뒿?덇퉴?')) return;
        fetch('/api/bookmarks/' + storeId, { method: 'DELETE', headers: csrfHeaders(false) })
            .then(function(r) {
                if (!r.ok) return;
                document.querySelectorAll('[data-id="' + storeId + '"]').forEach(function(el) { el.remove(); });
                var remaining = document.querySelectorAll('.mp-bm-card').length;
                var statVals = document.querySelectorAll('.mp-stat-val');
                if (statVals[0]) statVals[0].textContent = remaining;
                if (remaining === 0) location.reload();
            });
    }

    /* ?? 諛⑸Ц ?곹깭 蹂寃???????????????????????????????? */
    function updateStatus(storeId, newStatus, btn) {
        btn.disabled = true;
        fetch('/api/bookmarks/' + storeId + '/status', {
            method: 'PATCH',
            headers: csrfHeaders(true),
            body: JSON.stringify({ status: newStatus })
        }).then(function(r) {
            if (r.ok) location.reload();
            else btn.disabled = false;
        });
    }

    /* ?? 遺곷쭏??吏???????????????????????????????????? */
    function initMypageMap() {
        var container = document.getElementById('mypage-map');
        if (!container || typeof naver === 'undefined') return;

        var map = new naver.maps.Map(container, {
            center: new naver.maps.LatLng(37.5665, 126.9780),
            zoom: 11,
            zoomControl: true,
            zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER }
        });

        var items = window.mypageItems || [];
        var bounds = new naver.maps.LatLngBounds();
        var hasValid = false;
        var activeIW = null;

        items.forEach(function(item) {
            if (!item.latitude || !item.longitude) return;
            hasValid = true;

            var color = item.storeStatus === 'upcoming' ? '%23F59E0B'
                      : item.storeStatus === 'ended'    ? '%23AAAAAA'
                      : '%23FF4B4B';
            var svg = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='44' viewBox='0 0 32 44'><path d='M16 0C7.163 0 0 7.163 0 16c0 12 16 28 16 28s16-16 16-28C32 7.163 24.837 0 16 0z' fill='" + color + "'/><circle cx='16' cy='16' r='6.5' fill='white'/></svg>";

            var pos = new naver.maps.LatLng(item.latitude, item.longitude);
            var marker = new naver.maps.Marker({
                position: pos, map: map,
                icon: { url: svg, size: new naver.maps.Size(32,44), anchor: new naver.maps.Point(16,44) }
            });

            var sd = (item.startDate || '').replace(/-/g,'.');
            var ed = (item.endDate   || '').replace(/-/g,'.');
            var img = item.imageUrl
                ? '<img src="' + item.imageUrl + '" style="width:100%;height:80px;object-fit:cover;border-radius:6px;margin-bottom:8px;" onerror="this.style.display=\'none\'"/>'
                : '';
            var visitBadge = item.visitStatus === 'COMPLETED'
                ? '<span style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;background:#DCFCE7;color:#16A34A;margin-bottom:6px;">諛⑸Ц?꾨즺</span><br/>'
                : '';

            var iw = new naver.maps.InfoWindow({
                content: '<div style="padding:12px;min-width:200px;max-width:240px;font-family:-apple-system,sans-serif;line-height:1.5;">'
                    + img + visitBadge
                    + '<div style="font-size:11px;color:#6E6E73;margin-bottom:4px;">' + item.ddayLabel + '</div>'
                    + '<div style="font-size:14px;font-weight:700;color:#1A1A1A;margin-bottom:4px;">' + item.name + '</div>'
                    + '<div style="font-size:12px;color:#6E6E73;margin-bottom:8px;">' + sd + ' ~ ' + ed + '</div>'
                    + '<a href="/store/' + item.id + '" style="font-size:12px;color:#FF4B4B;font-weight:700;text-decoration:none;">?먯꽭??蹂닿린 ??/a>'
                    + '</div>',
                borderWidth: 0, disableAnchor: true, backgroundColor: 'white',
                pixelOffset: new naver.maps.Point(0, -10)
            });

            naver.maps.Event.addListener(marker, 'click', function() {
                if (activeIW) activeIW.close();
                iw.open(map, marker);
                activeIW = iw;
            });
            bounds.extend(pos);
        });

        naver.maps.Event.addListener(map, 'click', function() {
            if (activeIW) { activeIW.close(); activeIW = null; }
        });

        if (hasValid) {
            var validItems = items.filter(function(i){ return i.latitude && i.longitude; });
            if (validItems.length === 1) { map.setCenter(new naver.maps.LatLng(validItems[0].latitude, validItems[0].longitude)); map.setZoom(15); }
            else { map.fitBounds(bounds); }
        }
    }

    /* ?? 由щ럭 ??젣 ??????????????????????????????????? */
    function deleteReview(newsId) {
        if (!confirm('由щ럭瑜???젣?섏떆寃좎뒿?덇퉴?')) return;
        fetch('/api/news/' + newsId, { method: 'DELETE', headers: csrfHeaders(false) })
            .then(function(r) {
                if (!r.ok) return;
                var row = document.querySelector('[data-review-id="' + newsId + '"]');
                if (row) row.remove();
                var remaining = document.querySelectorAll('.mp-post-row').length;
                if (remaining === 0) location.reload();
            });
    }

    /* ?섏씠吏 濡쒕뱶 ??吏??珥덇린??*/
    if (document.getElementById('mypage-map')) {
        initMypageMap();
    }
</script>
</body>
</html>
