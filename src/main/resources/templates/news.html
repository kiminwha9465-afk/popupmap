<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"

<head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>?앹뾽 ?뚯떇 - ?앹뾽留?/title>
    <link rel="stylesheet" href="/css/style.css?v=16"/>
    <style>
        /* ?? ?꾧린 ??援щ텇 ??????????????????????????? */
        .news-tab-sep { display:inline-block; width:1px; height:14px; background:var(--border); margin:0 4px; align-self:center; }
        .news-tab-review { font-weight:600; }
        /* ?? ?꾧린 移대뱶 洹몃━????????????????????????? */
        .review-toolbar { display:flex; align-items:center; justify-content:flex-end; margin-bottom:16px; gap:10px; }
        .review-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
        @media(max-width:640px){ .review-grid { grid-template-columns:1fr; } }

        .review-card {
            background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius); padding:20px;
            box-shadow:var(--shadow-sm); cursor:pointer;
            transition:box-shadow .18s, transform .18s;
            display:flex; flex-direction:column; gap:12px;
        }
        .review-card:hover { box-shadow:var(--shadow); transform:translateY(-2px); }

        /* 移대뱶 ?ㅻ뜑 */
        .rc-header { display:flex; align-items:center; gap:10px; }
        .rc-avatar {
            width:38px; height:38px; border-radius:50%;
            background:var(--bg); border:1px solid var(--border);
            display:flex; align-items:center; justify-content:center;
            font-size:18px; flex-shrink:0;
        }
        .rc-meta { flex:1; min-width:0; }
        .rc-author { font-size:14px; font-weight:700; color:var(--text); }
        .rc-count { font-size:12px; color:var(--text-sub); margin-left:5px; }
        .rc-date { font-size:12px; color:var(--text-sub); flex-shrink:0; }

        /* 蹂꾩젏 */
        .rc-stars { display:flex; align-items:center; gap:3px; }
        .rc-star { font-size:15px; color:#e0e0e0; line-height:1; }
        .rc-star.filled { color:#f59e0b; }
        .rc-rating-text { font-size:13px; font-weight:700; color:#f59e0b; margin-left:4px; }

        /* ?몃꽕??*/
        .rc-thumb { width:100%; max-height:200px; object-fit:cover; border-radius:10px; }

        /* ?몄슜 ?띿뒪??*/
        .rc-quote { position:relative; padding:8px 12px; }
        .rc-qq { font-size:36px; line-height:1; color:var(--border); position:absolute; }
        .rc-qq.open { top:0; left:0; }
        .rc-qq.close { bottom:-8px; right:4px; }
        .rc-text {
            font-size:14px; color:var(--text); line-height:1.65;
            display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
            padding:4px 18px;
        }
        .rc-text-plain {
            font-size:14px; color:var(--text); line-height:1.65;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
        }

        /* ?곌껐 ?앹뾽 ?뺣낫 */
        .rc-store {
            display:flex; align-items:center; gap:10px; margin-top:auto;
            padding:10px 12px; background:var(--bg); border-radius:var(--radius-sm);
        }
        .rc-store-img { width:44px; height:44px; object-fit:cover; border-radius:8px; flex-shrink:0; }
        .rc-store-img-placeholder { width:44px; height:44px; border-radius:8px; background:var(--border); flex-shrink:0; }
        .rc-store-info { flex:1; min-width:0; }
        .rc-store-meta { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
        .rc-store-cat { font-size:11px; color:var(--text-sub); }
        .rc-store-status { font-size:11px; color:#1a8a4a; font-weight:600; }
        .rc-store-name { font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .rc-store-region { font-size:11px; color:var(--text-sub); margin-top:2px; }

        /* ?? 紐⑤떖 ?????????????????????????????????? */
        .rm-overlay {
            display:none; position:fixed; inset:0; z-index:1000;
            background:rgba(0,0,0,.6); align-items:center; justify-content:center;
            padding:20px;
            animation-duration:.18s;
        }
        .rm-overlay.open { display:flex; }
        .rm-box {
            background:var(--surface); border-radius:var(--radius);
            width:100%; max-width:680px; max-height:88vh; overflow-y:auto;
            box-shadow:0 24px 60px rgba(0,0,0,.25); position:relative;
            animation:rmSlideUp .2s ease;
        }
        @keyframes rmSlideUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .rm-head {
            display:flex; align-items:center; justify-content:space-between;
            padding:20px 24px 16px; border-bottom:1px solid var(--border);
            position:sticky; top:0; background:var(--surface); z-index:1;
        }
        .rm-head-title { font-size:17px; font-weight:800; }
        .rm-close {
            width:32px; height:32px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:20px; color:var(--text-sub); cursor:pointer;
            background:var(--bg); border:none; transition:all .15s;
        }
        .rm-close:hover { background:var(--border); color:var(--text); }
        .rm-body { padding:24px; display:flex; flex-direction:column; gap:18px; }
        .rm-user { display:flex; align-items:center; gap:12px; }
        .rm-avatar {
            width:46px; height:46px; border-radius:50%;
            background:var(--bg); border:1.5px solid var(--border);
            display:flex; align-items:center; justify-content:center;
            font-size:21px; flex-shrink:0; font-weight:700;
        }
        .rm-user-meta { flex:1; }
        .rm-user-name { font-size:15px; font-weight:700; }
        .rm-user-count { font-size:12px; color:var(--text-sub); margin-left:6px; }
        .rm-user-date { font-size:13px; color:var(--text-sub); }
        .rm-stars { display:flex; align-items:center; gap:4px; }
        .rm-star { font-size:22px; color:#e0e0e0; line-height:1; }
        .rm-star.filled { color:#f59e0b; }
        .rm-rating-text { font-size:14px; font-weight:700; color:#f59e0b; margin-left:6px; }
        .rm-content {
            font-size:15px; color:var(--text); line-height:1.85; white-space:pre-wrap;
            padding:18px 20px; background:var(--bg); border-radius:var(--radius-sm);
        }
        .rm-thumb { width:100%; border-radius:var(--radius-sm); object-fit:cover; max-height:360px; }
        .rm-store {
            display:flex; align-items:center; gap:12px;
            padding:14px 16px; background:var(--bg); border-radius:var(--radius-sm);
            border:1px solid var(--border);
        }
        .rm-store-img { width:56px; height:56px; object-fit:cover; border-radius:10px; }
        .rm-store-img-ph { width:56px; height:56px; border-radius:10px; background:var(--border); }
        .rm-store-info { flex:1; min-width:0; }
        .rm-store-meta { font-size:12px; color:var(--text-sub); margin-bottom:4px; }
        .rm-store-name { font-size:15px; font-weight:700; }
        .rm-store-region { font-size:12px; color:var(--text-sub); margin-top:3px; }
        .rm-divider { border:none; border-top:1px solid var(--border); margin:0; }
        .rm-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .rm-helpful-btn {
            display:flex; align-items:center; gap:8px;
            padding:10px 22px; border:1.5px solid var(--border); border-radius:24px;
            font-size:14px; font-weight:600; color:var(--text-sub);
            background:var(--surface); cursor:pointer; transition:all .15s;
        }
        .rm-helpful-btn:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
        .rm-helpful-btn.liked { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
        .rm-all-btn {
            margin-left:auto; padding:10px 22px;
            border:1.5px solid var(--border); border-radius:24px;
            text-align:center; font-size:14px; font-weight:600; color:var(--text);
            background:var(--surface); cursor:pointer; transition:all .15s;
            text-decoration:none; display:none;
        }
        .rm-all-btn:hover { background:var(--bg); }
        .rm-all-btn.visible { display:inline-flex; align-items:center; gap:5px; }

        /* ?? ?꾧린 ?묒꽦 紐⑤떖 ????????????????????????? */
        .wm-overlay {
            display:none; position:fixed; inset:0; z-index:1100;
            background:rgba(0,0,0,.55); align-items:center; justify-content:center;
            padding:20px;
        }
        .wm-overlay.open { display:flex; }
        .wm-box {
            background:var(--surface); border-radius:var(--radius);
            width:100%; max-width:600px; max-height:92vh;
            display:flex; flex-direction:column;
            box-shadow:0 24px 60px rgba(0,0,0,.28);
            animation:wmSlideUp .2s ease;
        }
        @keyframes wmSlideUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .wm-head {
            display:flex; align-items:center; justify-content:space-between;
            padding:20px 24px 16px; border-bottom:1px solid var(--border);
            flex-shrink:0;
        }
        .wm-title { font-size:17px; font-weight:800; }
        .wm-close {
            width:32px; height:32px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:20px; color:var(--text-sub); background:var(--bg);
            border:none; cursor:pointer; transition:all .15s; line-height:1;
        }
        .wm-close:hover { background:var(--border); color:var(--text); }
        .wm-body { padding:24px; overflow-y:auto; flex:1; }
        .wm-form { display:flex; flex-direction:column; gap:18px; }
        .wm-group { display:flex; flex-direction:column; gap:6px; }
        .wm-label { font-size:13px; font-weight:600; color:var(--text); }
        .wm-label-sub { font-weight:400; color:var(--text-sub); }
        .wm-input, .wm-textarea {
            padding:10px 14px; border:1.5px solid var(--border); border-radius:8px;
            font-size:14px; outline:none; transition:border-color .15s;
            background:var(--surface); font-family:inherit;
        }
        .wm-input:focus, .wm-textarea:focus { border-color:var(--primary); }
        .wm-textarea { resize:vertical; min-height:160px; line-height:1.7; }
        .wm-file { font-size:13px; color:var(--text-sub); padding:6px 0; }
        .wm-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }
        /* 蹂꾩젏 */
        .wm-stars { display:flex; flex-direction:row-reverse; gap:4px; width:fit-content; }
        .wm-stars input { display:none; }
        .wm-stars label { font-size:32px; color:#ddd; cursor:pointer; transition:color .1s; line-height:1; }
        .wm-stars input:checked ~ label,
        .wm-stars label:hover,
        .wm-stars label:hover ~ label { color:#f59e0b; }
        .wm-star-hint { font-size:12px; color:var(--text-sub); margin-top:4px; }
        /* ?앹뾽 ?먮룞?꾩꽦 */
        .wm-ac-wrap { position:relative; }
        .wm-ac-drop {
            position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:200;
            background:var(--surface); border:1px solid var(--border);
            border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.1);
            max-height:180px; overflow-y:auto; display:none;
        }
        .wm-ac-drop.open { display:block; }
        .wm-ac-item {
            padding:10px 14px; font-size:14px; cursor:pointer;
            border-bottom:1px solid var(--border); color:var(--text);
        }
        .wm-ac-item:last-child { border-bottom:none; }
        .wm-ac-item:hover, .wm-ac-item.active { background:var(--bg); color:var(--primary); }
        .wm-ac-empty { padding:10px 14px; font-size:13px; color:var(--text-sub); }
        .wm-ac-chip {
            display:none; align-items:center; gap:6px; margin-top:8px;
            padding:5px 10px 5px 12px; width:fit-content;
            background:var(--bg); border:1px solid var(--border); border-radius:20px;
            font-size:13px; color:var(--text);
        }
        .wm-ac-chip button {
            background:none; border:none; cursor:pointer;
            color:var(--text-sub); font-size:16px; line-height:1; padding:0;
            display:flex; align-items:center;
        }
        .wm-ac-chip button:hover { color:var(--primary); }
        @media(max-width:640px) {
            .wm-box { max-height:96vh; }
            .wm-head { padding:16px 18px 14px; }
            .wm-body { padding:18px; }
        }
    </style>
</head>

<script>
/* ?? ?꾧린 ?묒꽦 紐⑤떖 ?? */
(function () {
    var STORES = [];
    var wmModal = document.getElementById('writeModal');
    var wmSearch = document.getElementById('wmStoreSearch');
    var wmDrop   = document.getElementById('wmAcDrop');
    var wmId     = document.getElementById('wmStoreId');
    var wmChip   = document.getElementById('wmAcChip');
    var wmChipName = document.getElementById('wmChipName');
    var wmClear  = document.getElementById('wmAcClear');
    var acIdx    = -1;

    function loadStores(cb) {
        if (STORES.length > 0) { cb(); return; }
        fetch('/api/stores').then(function(r){ return r.json(); }).then(function(data){
            STORES = data.map(function(s){ return { id: s.id, name: s.name }; });
            cb();
        });
    }

    window.openWriteModal = function(preId, preName) {
        loadStores(function() {
            wmModal.classList.add('open');
            document.body.style.overflow = 'hidden';
            if (preId && preName) selectStore(preId, preName);
        });
    };

    window.closeWriteModal = function(e) {
        if (e && e.target !== wmModal) return;
        wmModal.classList.remove('open');
        document.body.style.overflow = '';
    };

    function selectStore(id, name) {
        wmId.value = id;
        wmChipName.textContent = name;
        wmChip.style.display = 'inline-flex';
        wmSearch.value = '';
        closeDrop();
    }

    function clearStore() {
        wmId.value = '';
        wmChip.style.display = 'none';
        wmSearch.value = '';
        closeDrop();
    }

    function closeDrop() { wmDrop.classList.remove('open'); wmDrop.innerHTML = ''; acIdx = -1; }

    function renderDrop(results) {
        wmDrop.innerHTML = '';
        acIdx = -1;
        if (!results.length) {
            wmDrop.innerHTML = '<div class="wm-ac-empty">寃??寃곌낵 ?놁쓬</div>';
        } else {
            results.forEach(function(s) {
                var el = document.createElement('div');
                el.className = 'wm-ac-item';
                el.textContent = s.name;
                el.addEventListener('mousedown', function(e){ e.preventDefault(); selectStore(s.id, s.name); });
                wmDrop.appendChild(el);
            });
        }
        wmDrop.classList.add('open');
    }

    wmSearch.addEventListener('input', function() {
        var q = this.value.trim();
        if (!q) { closeDrop(); return; }
        renderDrop(STORES.filter(function(s){ return s.name.toLowerCase().includes(q.toLowerCase()); }));
    });

    wmSearch.addEventListener('keydown', function(e) {
        var items = wmDrop.querySelectorAll('.wm-ac-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); acIdx = Math.min(acIdx+1, items.length-1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); acIdx = Math.max(acIdx-1, 0); }
        else if (e.key === 'Enter') { e.preventDefault(); var t = acIdx>=0 ? items[acIdx] : items[0]; if(t) t.dispatchEvent(new MouseEvent('mousedown')); return; }
        else if (e.key === 'Escape') { closeDrop(); return; }
        items.forEach(function(el,i){ el.classList.toggle('active', i===acIdx); });
    });

    wmSearch.addEventListener('blur', function(){ setTimeout(closeDrop, 150); });
    wmClear.addEventListener('click', function(){ clearStore(); wmSearch.focus(); });

    document.getElementById('wmForm').addEventListener('submit', function(e) {
        if (!wmId.value) {
            e.preventDefault();
            wmSearch.focus();
            wmSearch.style.borderColor = 'var(--primary)';
            wmSearch.placeholder = '愿???앹뾽???좏깮?댁＜?몄슂 (?꾩닔)';
            setTimeout(function(){ wmSearch.style.borderColor=''; wmSearch.placeholder='?꾧린瑜??④만 ?앹뾽??寃?됲븯?몄슂...'; }, 2500);
        }
    });

    document.addEventListener('keydown', function(e){ if(e.key==='Escape') { wmModal.classList.remove('open'); document.body.style.overflow=''; } });
})();

/* ?? 鍮꾨줈洹몄씤 踰꾪듉 ?? */
(function () {
    ['writeBtn', 'writeBtn2'].forEach(function(btnId) {
        var btn = document.getElementById(btnId);
        if (!btn) return;
        btn.addEventListener('click', function () {
            var toast = document.getElementById('loginToast');
            toast.hidden = false;
            setTimeout(function () { location.href = '/login'; }, 1500);
        });
    });
})();

function openReviewModal(card) {
    var d           = card.dataset;
    var id          = d.id || '';
    var author      = d.author || '?듬챸';
    var rating      = parseInt(d.rating) || 0;
    var content     = d.content || '';
    var thumb       = d.thumbnail || '';
    var pub         = d.published || '';
    var likeCount   = parseInt(d.likeCount) || 0;
    var reviewCount = parseInt(d.reviewCount) || 1;
    var storeId     = d.storeId || '';
    var storeName   = d.storeName || '';
    var storeImg    = d.storeImg || '';
    var storeCat    = d.storeCat || '';
    var storeRegion = d.storeRegion || '';
    var date = pub ? pub.replace(/(\d{4})-(\d{2})-(\d{2}).*/, '$1.$2.$3') : '';

    document.getElementById('rmAvatar').textContent  = author.charAt(0);
    document.getElementById('rmAuthor').textContent  = author;
    document.getElementById('rmCount').textContent   = '?꾧린 ' + reviewCount;
    document.getElementById('rmDate').textContent    = date;

    var starsRow = document.getElementById('rmStarsRow');
    starsRow.innerHTML = '';
    if (rating > 0) {
        for (var i = 1; i <= 5; i++) {
            var s = document.createElement('span');
            s.className = 'rm-star' + (i <= rating ? ' filled' : '');
            s.textContent = '??;
            starsRow.appendChild(s);
        }
        var ratingTxt = document.createElement('span');
        ratingTxt.className = 'rm-rating-text';
        ratingTxt.textContent = rating + '.0 / 5.0';
        starsRow.appendChild(ratingTxt);
    }

    var thumbEl = document.getElementById('rmThumb');
    if (thumb) {
        thumbEl.src = thumb;
        thumbEl.style.display = 'block';
    } else {
        thumbEl.style.display = 'none';
    }

    document.getElementById('rmContent').textContent = content;

    var storeBox = document.getElementById('rmStore');
    var allBtn   = document.getElementById('rmAllBtn');
    if (storeId) {
        storeBox.style.display = 'flex';
        var storeImgEl = document.getElementById('rmStoreImg');
        var storeImgPh = document.getElementById('rmStoreImgPh');
        if (storeImg) {
            storeImgEl.src = storeImg;
            storeImgEl.style.display = 'block';
            storeImgPh.style.display = 'none';
        } else {
            storeImgEl.style.display = 'none';
            storeImgPh.style.display = 'block';
        }
        document.getElementById('rmStoreCat').textContent    = (storeCat || '') + ' ??吏꾪뻾以?;
        document.getElementById('rmStoreName').textContent   = storeName;
        document.getElementById('rmStoreRegion').textContent = storeRegion;
        allBtn.href = '/store/' + storeId;
        allBtn.classList.add('visible');
    } else {
        storeBox.style.display = 'none';
        allBtn.classList.remove('visible');
    }

    currentReviewId = id;
    document.getElementById('rmLikeCount').textContent = likeCount > 0 ? '(' + likeCount + ')' : '';

    document.getElementById('reviewModal').classList.add('open');
    document.body.style.overflow = 'hidden';
}

var currentReviewId = null;

function submitLike() {
    if (!currentReviewId) return;
    var csrfMeta = document.querySelector('meta[name="_csrf"]');
    var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    var headers = { 'Content-Type': 'application/json' };
    if (csrfMeta && csrfHeaderMeta && csrfMeta.content) {
        headers[csrfHeaderMeta.content] = csrfMeta.content;
    }
    fetch('/api/news/' + currentReviewId + '/like', { method: 'POST', headers: headers })
        .then(function(res) {
            if (res.status === 401) {
                window.location.href = '/login';
                return null;
            }
            return res.json();
        })
        .then(function(data) {
            if (!data) return;
            var countEl = document.getElementById('rmLikeCount');
            countEl.textContent = data.likeCount > 0 ? '(' + data.likeCount + ')' : '';
            var btn = document.getElementById('rmLikeBtn');
            if (data.liked) {
                btn.classList.add('liked');
            } else {
                btn.classList.remove('liked');
            }
        })
        .catch(function() {});
}

function closeModal() {
    document.getElementById('reviewModal').classList.remove('open');
    document.body.style.overflow = '';
}

function closeReviewModal(e) {
    if (e.target === document.getElementById('reviewModal')) closeModal();
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
