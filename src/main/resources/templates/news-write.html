<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소식 작성 - 팝업맵</title>
    <link rel="stylesheet" href="/css/style.css?v=11"/>
    <style>
        /* ── 별점 입력 ── */
        .star-rating { display:flex; flex-direction:row-reverse; gap:4px; width:fit-content; }
        .star-rating input { display:none; }
        .star-rating label { font-size:34px; color:#ddd; cursor:pointer; transition:color .1s; line-height:1; }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color:#f59e0b; }
        .star-hint { font-size:12px; color:var(--text-sub); margin-top:6px; }

        .store-autocomplete { position: relative; }
        .store-ac-dropdown {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 200;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); box-shadow: 0 4px 14px rgba(0,0,0,.1);
            max-height: 200px; overflow-y: auto; display: none;
        }
        .store-ac-dropdown.open { display: block; }
        .store-ac-item {
            padding: 10px 14px; font-size: 14px; cursor: pointer;
            border-bottom: 1px solid var(--border); color: var(--text);
        }
        .store-ac-item:last-child { border-bottom: none; }
        .store-ac-item:hover, .store-ac-item.active { background: var(--bg); color: var(--primary); }
        .store-ac-empty { padding: 10px 14px; font-size: 13px; color: var(--text-sub); }
        .store-ac-chip {
            display: none; align-items: center; gap: 6px; margin-top: 8px;
            padding: 5px 10px 5px 12px; width: fit-content;
            background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
            font-size: 13px; color: var(--text);
        }
        .store-ac-chip button {
            display: flex; align-items: center;
            background: none; border: none; cursor: pointer;
            color: var(--text-sub); font-size: 16px; line-height: 1; padding: 0;
        }
        .store-ac-chip button:hover { color: var(--primary); }
    </style>
</head>
<body>

<header class="header">
<div class="header-inner">
    <div class="header-top">
        <a href="/" class="header-brand">
            <img src="/favicon.svg" class="brand-icon" alt="팝업맵"/>
            <span class="brand-text">팝업맵</span>
        </a>
        <div class="header-top-right">
            <div class="header-right">
                <div class="header-auth">
                    <div sec:authorize="isAuthenticated()" class="bell-wrap">
                        <button class="bell-btn" id="bellBtn" title="알림">
                            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="1.6"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
                            </svg>
                            <span th:if="${bellCount != null and bellCount > 0}" class="bell-badge" th:text="${bellCount}"></span>
                        </button>
                        <div class="bell-dropdown" id="bellDropdown" hidden>
                            <div class="bell-dd-hd">D-3 마감 북마크</div>
                            <div th:if="${bellCount == null or bellCount == 0}" class="bell-dd-empty">임박한 종료 팝업이 없어요</div>
                            <a th:each="item : ${bellItems}" th:href="@{/store/{id}(id=${item.id})}" class="bell-dd-item">
                                <span class="bell-dd-name" th:text="${item.name}"></span>
                                <span class="bell-dd-dday"
                                      th:text="${item.dday == 0} ? 'D-DAY' : ('D-' + ${item.dday})"
                                      th:classappend="${item.dday == 0} ? ' dday-today'"></span>
                            </a>
                            <a href="/mypage" class="bell-dd-footer">북마크 관리 →</a>
                        </div>
                    </div>
                    <a sec:authorize="hasRole('ADMIN')" href="/admin" class="auth-link-btn admin-link-btn">관리자페이지</a>
                    <a sec:authorize="isAuthenticated()" href="/mypage" class="auth-link-btn">마이페이지</a>
                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline;">
                        <button type="submit" class="auth-link-btn">로그아웃</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="header-nav-row">
        <nav class="header-nav">
            <span class="nav-group-label">팝업</span>
            <a href="/stores" class="nav-link">전체보기</a>
            <span class="nav-sep"></span>
            <span class="nav-group-label">커뮤니티</span>
            <a href="/news" class="nav-link nav-news-item">전체</a>
            <a href="/news?tag=공지" class="nav-link nav-news-item">공지</a>
            <a href="/news?tag=소식" class="nav-link nav-news-item">소식</a>
            <a href="/news?tag=트렌드" class="nav-link nav-news-item">트렌드</a>
            <a href="/news?tag=후기" class="nav-link nav-news-item active">후기</a>
            <details class="nav-dropdown">
                <summary>
                    커뮤니티
                    <svg class="drop-arrow" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
                </summary>
                <div class="nav-dropdown-menu">
                    <a href="/news" class="nav-dropdown-item">전체</a>
                    <a href="/news?tag=공지" class="nav-dropdown-item">공지</a>
                    <a href="/news?tag=소식" class="nav-dropdown-item">소식</a>
                    <a href="/news?tag=트렌드" class="nav-dropdown-item">트렌드</a>
                    <div class="nav-dropdown-divider"></div>
                    <span class="nav-dropdown-label">후기</span>
                    <a href="/news?tag=후기" class="nav-dropdown-item">후기</a>
                </div>
            </details>
        </nav>
    </div>
</div>
</header>

<div class="news-write-page">
    <div class="news-write-inner">
        <h1 class="news-write-title">소식 작성</h1>

        <form th:action="@{/news/write}" method="post" enctype="multipart/form-data" class="news-write-form" id="writeForm">

            <div class="form-group">
                <label class="form-label">태그</label>
                <select name="tag" class="form-select">
                    <option value="공지"  th:selected="${defaultTag == '공지'}">공지</option>
                    <option value="소식"  th:selected="${defaultTag == '소식'}">소식</option>
                    <option value="트렌드" th:selected="${defaultTag == '트렌드'}">트렌드</option>
                    <option value="후기"  th:selected="${defaultTag == '후기'}">후기</option>
                </select>
            </div>

            <!-- 별점 (후기 태그일 때만 표시) -->
            <div class="form-group" id="rating-group" style="display:none;">
                <label class="form-label">별점</label>
                <div class="star-rating">
                    <input type="radio" name="rating" id="s5" value="5">
                    <label for="s5">★</label>
                    <input type="radio" name="rating" id="s4" value="4">
                    <label for="s4">★</label>
                    <input type="radio" name="rating" id="s3" value="3">
                    <label for="s3">★</label>
                    <input type="radio" name="rating" id="s2" value="2">
                    <label for="s2">★</label>
                    <input type="radio" name="rating" id="s1" value="1">
                    <label for="s1">★</label>
                </div>
                <p class="star-hint">별을 클릭해서 점수를 선택하세요 (1~5점)</p>
            </div>

            <div class="form-group" id="store-picker-group">
                <label class="form-label">관련 팝업 <span class="form-label-sub" style="color:var(--primary);">*필수</span></label>
                <div class="store-autocomplete">
                    <input type="text" id="store-search" class="form-input"
                           placeholder="후기를 남길 팝업을 검색하세요..." autocomplete="off"/>
                    <div id="store-ac-dropdown" class="store-ac-dropdown"></div>
                    <input type="hidden" name="popupStoreId" id="store-id-input"/>
                    <div id="store-ac-chip" class="store-ac-chip">
                        <span id="store-ac-chip-name"></span>
                        <button type="button" id="store-ac-clear" title="선택 해제">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M18 6 6 18M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" name="title" class="form-input" placeholder="제목을 입력하세요" required/>
            </div>

            <div class="form-group">
                <label class="form-label">썸네일 <span class="form-label-sub">(선택, 이미지 파일)</span></label>
                <input type="file" name="thumbnailFile" class="form-file" accept="image/*"/>
            </div>

            <div class="form-group">
                <label class="form-label">내용</label>
                <textarea name="content" class="form-textarea" rows="16" placeholder="내용을 입력하세요" required></textarea>
            </div>

            <div class="form-actions">
                <a href="/news" class="btn-secondary">취소</a>
                <button type="submit" class="btn-primary">등록</button>
            </div>
        </form>
    </div>
</div>

<footer class="footer">
    <div class="footer-inner">
        <span class="footer-logo"><img src="/favicon.svg" class="brand-icon" alt="팝업맵"/> 팝업맵</span>
        <span class="footer-copy">전국 팝업스토어 일정 및 위치 정보 서비스</span>
    </div>
</footer>

<script src="/js/nav.js"></script>
<script th:inline="javascript">
(function () {
    const STORES = /*[[${stores}]]*/ [];

    const tagSelect    = document.querySelector('select[name="tag"]');
    const ratingGroup  = document.getElementById('rating-group');
    const pickerGroup  = document.getElementById('store-picker-group');
    const searchInput  = document.getElementById('store-search');
    const dropdown     = document.getElementById('store-ac-dropdown');
    const idInput      = document.getElementById('store-id-input');
    const chip         = document.getElementById('store-ac-chip');
    const chipName     = document.getElementById('store-ac-chip-name');
    const clearBtn     = document.getElementById('store-ac-clear');

    let activeIdx = -1;

    function syncPicker() {
        var isReview = tagSelect.value === '후기';
        ratingGroup.style.display  = isReview ? 'block' : 'none';
        pickerGroup.style.display  = isReview ? 'block' : 'none';
        if (!isReview) clearSelection();
    }

    function clearSelection() {
        searchInput.value = '';
        idInput.value = '';
        chip.style.display = 'none';
        closeDropdown();
    }

    function selectStore(id, name) {
        idInput.value = id;
        chipName.textContent = name;
        chip.style.display = 'inline-flex';
        searchInput.value = '';
        closeDropdown();
    }

    function closeDropdown() {
        dropdown.classList.remove('open');
        dropdown.innerHTML = '';
        activeIdx = -1;
    }

    function renderDropdown(results) {
        dropdown.innerHTML = '';
        activeIdx = -1;
        if (results.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'store-ac-empty';
            empty.textContent = '검색 결과 없음';
            dropdown.appendChild(empty);
        } else {
            results.forEach(function (s, i) {
                var item = document.createElement('div');
                item.className = 'store-ac-item';
                item.textContent = s.name;
                item.addEventListener('mousedown', function (e) {
                    e.preventDefault();
                    selectStore(s.id, s.name);
                });
                dropdown.appendChild(item);
            });
        }
        dropdown.classList.add('open');
    }

    function getItems() {
        return dropdown.querySelectorAll('.store-ac-item');
    }

    searchInput.addEventListener('input', function () {
        var q = this.value.trim();
        if (!q) { closeDropdown(); return; }
        var matched = STORES.filter(function (s) {
            return s.name.toLowerCase().includes(q.toLowerCase());
        });
        renderDropdown(matched);
    });

    searchInput.addEventListener('keydown', function (e) {
        var items = getItems();
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIdx = Math.min(activeIdx + 1, items.length - 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIdx = Math.max(activeIdx - 1, 0);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            var target = activeIdx >= 0 ? items[activeIdx] : items[0];
            if (target) target.dispatchEvent(new MouseEvent('mousedown'));
            return;
        } else if (e.key === 'Escape') {
            closeDropdown(); return;
        }
        items.forEach(function (el, i) {
            el.classList.toggle('active', i === activeIdx);
        });
    });

    searchInput.addEventListener('blur', function () {
        setTimeout(closeDropdown, 150);
    });

    clearBtn.addEventListener('click', function () {
        clearSelection();
        searchInput.focus();
    });

    tagSelect.addEventListener('change', syncPicker);
    syncPicker();

    // 상세페이지에서 넘어온 경우 팝업 자동 선택
    var PRE = /*[[${preSelectedStore}]]*/ null;
    if (PRE) {
        selectStore(PRE.id, PRE.name);
    }

    // 후기 작성 시 팝업 선택 필수 검사
    document.getElementById('writeForm').addEventListener('submit', function (e) {
        if (tagSelect.value === '후기' && !idInput.value) {
            e.preventDefault();
            searchInput.focus();
            searchInput.style.borderColor = 'var(--primary)';
            searchInput.placeholder = '관련 팝업을 선택해주세요 (필수)';
            setTimeout(function () {
                searchInput.style.borderColor = '';
                searchInput.placeholder = '후기를 남길 팝업을 검색하세요...';
            }, 2500);
        }
    });
})();
</script>
</body>
</html>
