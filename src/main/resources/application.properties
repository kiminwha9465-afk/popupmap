spring.application.name=popupmap

# 카카오 JavaScript 앱 키 - https://developers.kakao.com 에서 발급
kakao.api.key=YOUR_KAKAO_JS_API_KEY

spring.datasource.url=jdbc:mariadb://localhost:3306/popupmapdb
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.thymeleaf.cache=false

logging.file.name=C:/popupmap/app.log
logging.level.root=INFO
logging.level.com.example.popupmap=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
